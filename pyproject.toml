[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "bayesianoptimization"
version = "0.0.1"
description = "In this project we will be working with BO"
authors = [{ name = "BO7", email = "your@email.com" }]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi==0.115.6",
  "ipykernel>=7.2.0",
  "scikit-learn>=1.8.0",
  "scikit-optimize>=0.10.2",
  "typer==0.15.1",
  "uvicorn==0.34.0",

  # --- PyTorch: cross-platform, reproducible ---
  # On macOS (incl Apple Silicon), install the default PyPI wheels (CPU / MPS-capable builds).
  "torch==2.6.0; sys_platform == 'darwin'",
  "torchvision==0.21.0; sys_platform == 'darwin'",

  # On Linux/Windows, use CUDA 12.4 wheels from the PyTorch index.
  # NOTE: the "+cu124" local version tag is important so uv picks the CUDA builds.
  "torch==2.6.0+cu124; sys_platform != 'darwin'",
  "torchvision==0.21.0+cu124; sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
  "coverage==7.6.9",
  "invoke==2.2.0",
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "ruff==0.1.3",
  "mypy==1.19.1",
  "mkdocs-material==9.7.1",
  "mkdocstrings-python==2.0.1",
]

# Make the PyTorch CUDA index available but *explicit* so uv won't pull random deps (like requests) from it.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Tell uv: only resolve the CUDA-tagged torch/torchvision from that explicit index.
[tool.uv.sources]
"torch==2.6.0+cu124" = { index = "pytorch-cu124" }
"torchvision==0.21.0+cu124" = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
