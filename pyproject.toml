[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "bayesianoptimization"
version = "0.0.1"
description = "In this project we will be working with BO"
authors = [{ name = "BO7", email = "your@email.com" }]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi==0.115.6",
  "ipykernel>=7.2.0",
  "scikit-learn>=1.8.0",
  "scikit-optimize>=0.10.2",
  "typer==0.15.1",
  "uvicorn==0.34.0",

  # --- PyTorch (reproducible across OSes) ---
  # macOS: use regular PyPI wheels (CPU / MPS backend on Apple Silicon)
  "torch==2.6.0; sys_platform == 'darwin'",
  "torchvision==0.21.0; sys_platform == 'darwin'",

  # Linux + Windows: use CUDA 12.4 wheels
  "torch==2.6.0+cu124; sys_platform != 'darwin'",
  "torchvision==0.21.0+cu124; sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
  "coverage==7.6.9",
  "invoke==2.2.0",
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "ruff==0.1.3",
  "mypy==1.19.1",
  "mkdocs-material==9.7.1",
  "mkdocstrings-python==2.0.1",
]

# PyTorch CUDA index: make it explicit so it is ONLY used when a package is mapped to it
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Route torch/torchvision to the CUDA index (works because CUDA versions are requested via +cu124 above)
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
